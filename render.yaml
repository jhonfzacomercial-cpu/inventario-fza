# Blueprint para o Render (https://render.com) — plano GRATUITO.
# O banco de dados fica no Neon (https://neon.tech), também gratuito e sem prazo de expiração.
# No Render: New > Blueprint > selecione este repositório e preencha as variáveis pedidas.
services:
  - type: web
    name: inventario-fza
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Cole aqui a "connection string" do Neon (postgresql://...neon.tech/...?sslmode=require)
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: APP_URL
        sync: false
