# Blueprint para o Render (https://render.com): New > Blueprint > selecione o repositório.
services:
  - type: web
    name: inventario-fza
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: inventario-fza-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"   # URL interna do Render; use "true" com a URL externa
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: APP_URL
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
databases:
  - name: inventario-fza-db
    plan: basic-256mb
    databaseName: inventario
